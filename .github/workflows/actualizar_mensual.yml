name: Actualizar Visor Sequia SEAS5

on:
  schedule:
    # Se ejecuta automáticamente el día 12 de cada mes a las 08:00 UTC
    # (ECMWF publica la nueva corrida mensual entre los días 5 y 10)
    - cron: '0 8 12 * *'
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón cuando quieras

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias geoespaciales
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar modelo hidrológico y generar index.html
        run: python actualizar_visor.py

      - name: Guardar y publicar index.html actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización automática pronóstico SEAS5" && git push)
